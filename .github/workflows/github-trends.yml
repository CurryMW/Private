name: GitHub AI 趋势快照

on:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dingtalk-github-trends
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GITHUB_TRENDS_STATE_PATH: .state/github-trends/baseline.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .state/github-trends
          key: dingtalk-github-trends-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dingtalk-github-trends-state-${{ runner.os }}-
      - run: python -m ai_daily.github_trends_cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: success()
        with:
          path: .state/github-trends
          key: dingtalk-github-trends-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
